<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, Zoe</title>
  <style>
    :root { --azul: #065bc8; --glauco: #2aa89e; --blanco: #fff; --margen: 16px; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--blanco); font-family: "Segoe UI", sans-serif; display: grid; place-items: center; background: linear-gradient(to top, rgba(5,90,200,.85), rgba(4,41,58,.15)); }
    #bg-carousel { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; opacity: .22; filter: saturate(.95) blur(.6px); transition: background-image 1s ease; }
    #inicio, #contenedor, #mensaje-amistad, #invitacion { display: flex; flex-direction: column; align-items: center; }
    #inicio { gap: 10px; } .texto-encima-boton { font-size: 1.1rem; }
    .boton-circular { width: 100px; height: 100px; border: 0; border-radius: 50%; color: white; font-size: 1.8rem; cursor: pointer; background: #ff3b30; box-shadow: 0 0 20px rgba(255,0,0,.7); animation: latido 1s infinite; }
    @keyframes latido { 50% { transform: scale(1.08); } }
    #contenedor, #mensaje-amistad { width: min(720px, calc(100% - var(--margen) * 2)); padding: 24px; margin: var(--margen); border: 3px solid white; border-radius: 20px; color: #132131; background: rgba(255,255,255,.93); text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,.22); animation: aparecer .6s ease both; }
    @keyframes aparecer { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #titulo { margin: 0 0 12px; color: #c2185b; font-weight: 700; font-size: clamp(1.45rem, 5vw, 2.2rem); }
    #imagen { width: min(350px, 90%); max-height: 330px; object-fit: cover; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.25); }
    #frase { min-height: 5em; margin: 18px 0 8px; display: grid; place-items: center; font-size: clamp(1.1rem, 3.7vw, 1.35rem); font-weight: 600; line-height: 1.42; }
    #siguienteBtn, .decision-btn { border: 0; border-radius: 12px; padding: 12px 25px; cursor: pointer; color: white; font-size: 1rem; font-weight: 700; background: linear-gradient(100deg, var(--azul), var(--glauco)); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
    #mensaje-amistad { font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 650; line-height: 1.45; }
    .palabra-lluvia { position: fixed; top: -50px; z-index: -1; font-weight: bold; pointer-events: none; animation: caer 4s linear; }
    @keyframes caer { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(105vh); opacity: 0; } }
    .corazon { position: fixed; bottom: -30px; width: 20px; height: 20px; background: var(--cor-color, #ff3b30); transform: rotate(45deg); animation: flotar 8s linear forwards; pointer-events: none; }
    .corazon::before, .corazon::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: inherit; }
    .corazon::before { top: -10px; } .corazon::after { left: -10px; }
    @keyframes flotar { to { transform: translateY(-110vh) rotate(45deg); opacity: 0; } }
    body.final { background: #0d5a9b; }
    body.final::before { content: ""; position: fixed; inset: -35vmax; z-index: -2; background: radial-gradient(circle at 25% 30%, #8bd5e3 0 9%, transparent 25%), radial-gradient(circle at 78% 65%, #0869cb 0 11%, transparent 31%), radial-gradient(circle at 48% 48%, #2aa89e 0 14%, #11458d 45%, #102c67 70%); background-size: 65% 65%, 70% 70%, 100% 100%; animation: oleaje 22s ease-in-out infinite alternate; }
    @keyframes oleaje { to { transform: rotate(16deg) scale(1.14) translate(4%, -3%); filter: hue-rotate(15deg); } }
    #invitacion { width: min(650px, calc(100% - var(--margen) * 2)); gap: 14px; padding: 32px 20px; text-align: center; text-shadow: 0 2px 14px rgba(0,0,0,.38); }
    #invitacion h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; } #invitacion p { margin: 0 0 16px; font-size: clamp(1.1rem, 4vw, 1.5rem); }
    .opciones { position: relative; width: min(400px, 90vw); min-height: 170px; display: flex; justify-content: center; gap: 18px; align-items: flex-start; }
    #noBtn { background: rgba(12,39,91,.85); position: relative; transition: left .28s ease, top .28s ease; } #nota-no { min-height: 1.4em; font-size: .9rem; }
    .oculto { display: none !important; }
    @media (max-width: 600px) { #contenedor, #mensaje-amistad { padding: 18px; } .opciones { min-height: 210px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="bg-carousel" aria-hidden="true"></div>
  <audio id="musica" src="audiooficial.mp3" autoplay muted loop></audio>
  <section id="inicio"><div class="texto-encima-boton">Haz clic aquí</div><button class="boton-circular" id="boton" type="button" aria-label="Abrir mensaje para Zoe">💖</button></section>
  <main id="contenedor" class="oculto"><h1 id="titulo">PARA TI, ZOE</h1><img id="imagen" src="imagen1.jpg" alt="Un recuerdo bonito para Zoe"><div id="frase" aria-live="polite"></div><button id="siguienteBtn" type="button">Siguiente</button></main>
  <section id="mensaje-amistad" class="oculto" aria-live="polite">Solo trato de animarte porque eso es lo que los amigos hacen. Entenderé si quizá prefieres aún estar sola. 💙</section>
  <section id="invitacion" class="oculto"><h1>¿Miramos una película clásica de anime?</h1><p>Sé que te encantará ✨</p><div>Aplasta el botón:</div><div class="opciones"><button class="decision-btn" id="siBtn" type="button">Sí 💙</button><button class="decision-btn" id="noBtn" type="button">No</button></div><div id="nota-no" aria-live="polite"></div></section>
  <div id="contenedor-palabras" aria-hidden="true"></div><div id="contenedor-corazones" aria-hidden="true"></div>
  <script>
    const frases = [
      'Helllooooouuuu',
      'Te habla el más sonso de los sonsos jasjkdjka: un zonziiitooo algo enfermito (por la gripe :u).',
      'Oyeee, al parecer tuviste un bajón muy fuerteee :c',
      'Me cuesta creerlo después de haberte visto muy alegre ayer.',
      'Se nota que eres una persona súper divertidaaa. No quisiera saber que estás triste; no importa qué tan fuerte sea la tormenta, porque siempre al final saldrá el sol. Así que animoos, Zoeeeee.',
      'Quieroo animarteeeeeeeeee.',
      'Me dijiste que te gusta el animeeeee, entonces ¿qué te parece si más tarde vemos una película clásicaaa de animeee? Sé que te gustaráaa ;)'
    ];
    const imagenes = ['imagen1.jpg', 'imagen2.jpg', 'imagen3.jpg', 'imagen4.jpg'];
    const palabras = ['hermosa', 'Zoe', 'Julia', 'Guadalupe', 'Lupe', 'bella', 'divina', 'linda', 'Sirenita', 'sonsita', 'blue', 'blucita', 'azulita', 'azuul'];
    let indice = 0, intentosNo = 0, efectosActivos = true;
    const $ = (id) => document.getElementById(id);
    function actualizarDiapositiva() { $('imagen').src = imagenes[indice % imagenes.length]; $('frase').textContent = frases[indice]; $('siguienteBtn').textContent = indice === frases.length - 1 ? 'Siguiente ✨' : 'Siguiente'; }
    function abrirChat(texto) { window.open(`https://wa.me/51948996922?text=${encodeURIComponent(texto)}`, '_blank', 'noopener'); }
    function mostrarFinal() { $('mensaje-amistad').classList.add('oculto'); $('contenedor-palabras').replaceChildren(); $('contenedor-corazones').replaceChildren(); efectosActivos = false; document.body.classList.add('final'); $('bg-carousel').classList.add('oculto'); $('invitacion').classList.remove('oculto'); }
    $('boton').addEventListener('click', () => { $('inicio').classList.add('oculto'); $('contenedor').classList.remove('oculto'); const musica = $('musica'); musica.muted = false; musica.play().catch(() => {}); indice = 0; actualizarDiapositiva(); });
    $('siguienteBtn').addEventListener('click', () => { if (indice < frases.length - 1) { indice++; actualizarDiapositiva(); return; } $('contenedor').classList.add('oculto'); $('mensaje-amistad').classList.remove('oculto'); setTimeout(mostrarFinal, 4300); });
    $('siBtn').addEventListener('click', () => abrirChat('oyee sonsitoo,siii, hay que ver una pelicula ugu'));
    $('noBtn').addEventListener('click', () => { intentosNo++; if (intentosNo >= 5) { abrirChat('perdon, Anderson, en estos momentos deseo no hablar'); return; } const area = document.querySelector('.opciones'), boton = $('noBtn'); const maxX = Math.max(0, area.clientWidth - boton.offsetWidth), maxY = Math.max(35, area.clientHeight - boton.offsetHeight); boton.style.position = 'absolute'; boton.style.left = `${Math.random() * maxX}px`; boton.style.top = `${Math.random() * maxY}px`; $('nota-no').textContent = `Uy, ese botón se escapó (${intentosNo}/5) 😅`; });
    setInterval(() => { if (!efectosActivos) return; const palabra = document.createElement('div'); palabra.className = 'palabra-lluvia'; palabra.style.left = `${Math.random() * 90}%`; palabra.style.color = Math.random() > .5 ? '#ff3b30' : '#60bfff'; palabra.style.fontSize = `${18 + Math.random() * 18}px`; palabra.textContent = palabras[Math.floor(Math.random() * palabras.length)]; $('contenedor-palabras').append(palabra); setTimeout(() => palabra.remove(), 4500); }, 650);
    setInterval(() => { if (!efectosActivos) return; const corazon = document.createElement('div'); corazon.className = 'corazon'; corazon.style.setProperty('--cor-color', Math.random() > .5 ? '#ff3b30' : '#065bc8'); corazon.style.left = `${Math.random() * 100}vw`; corazon.style.animationDuration = `${5 + Math.random() * 5}s`; $('contenedor-corazones').append(corazon); setTimeout(() => corazon.remove(), 10000); }, 350);
    (() => { const bg = $('bg-carousel'), fondos = ['zoe2.png', 'zoe1.jpeg']; let i = 0; const cambiar = () => { bg.style.backgroundImage = `url(${fondos[i]})`; i = (i + 1) % fondos.length; }; cambiar(); setInterval(cambiar, 5000); })();
  </script>
</body>
</html>
