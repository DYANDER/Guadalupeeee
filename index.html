<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti, Zoe</title>
  <style>
    :root { --azul: #065bc8; --glauco: #2aa89e; --blanco: #fff; --margen: 16px; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; overflow-x: hidden; color: var(--blanco); font-family: "Segoe UI", sans-serif; display: grid; place-items: center; background: linear-gradient(to top, rgba(5,90,200,.85), rgba(4,41,58,.15)); }
    #bg-carousel { position: fixed; inset: 0; z-index: -2; background-size: cover; background-position: center; opacity: .22; filter: saturate(.95) blur(.6px); transition: background-image 1s ease; }
    #inicio, #contenedor, #mensaje-amistad, #invitacion { display: flex; flex-direction: column; align-items: center; }
    #inicio { width: 100%; min-height: 100svh; justify-content: center; gap: 14px; padding: var(--margen); text-align: center; }
    #titulo-inicio { margin: 0; font-size: clamp(2.2rem, 10vw, 4.8rem); letter-spacing: .12em; text-shadow: 0 3px 18px rgba(5,42,100,.56); }
    .texto-encima-boton { font-size: clamp(1.1rem, 4vw, 1.35rem); }
    .boton-circular { width: clamp(100px, 24vw, 124px); height: clamp(100px, 24vw, 124px); border: 0; border-radius: 50%; color: white; font-size: clamp(2.1rem, 8vw, 3rem); cursor: pointer; background: linear-gradient(145deg, #398dea, #0756ba); box-shadow: 0 0 26px rgba(70,172,255,.7); animation: latido 1s infinite; }
    @keyframes latido { 50% { transform: scale(1.08); } }
    #contenedor { width: min(720px, calc(100% - var(--margen) * 2)); padding: 24px; margin: auto var(--margen); align-self: center; justify-self: center; border: 3px solid white; border-radius: 20px; color: #132131; background: rgba(255,255,255,.985); text-align: center; box-shadow: 0 12px 35px rgba(0,0,0,.22); animation: aparecer 1.45s cubic-bezier(.22,1,.36,1) both; }
    @keyframes aparecer { from { transform: scale(.72); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #titulo { margin: 0 0 12px; color: #c2185b; font-weight: 700; font-size: clamp(1.45rem, 5vw, 2.2rem); }
    #imagen { width: min(350px, 90%); max-height: 330px; object-fit: cover; border-radius: 18px; box-shadow: 0 0 15px rgba(0,0,0,.25); }
    #frase { min-height: 5em; margin: 18px 0 8px; display: grid; place-items: center; font-size: clamp(1.1rem, 3.7vw, 1.35rem); font-weight: 600; line-height: 1.42; }
    #siguienteBtn, .decision-btn { border: 0; border-radius: 12px; padding: 12px 25px; cursor: pointer; color: white; font-size: 1rem; font-weight: 700; background: linear-gradient(100deg, var(--azul), var(--glauco)); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
    #mensaje-amistad { position: fixed; z-index: 5; top: 50%; left: 50%; width: min(610px, calc(100% - var(--margen) * 2)); padding: clamp(20px, 5vw, 34px); border: 1px solid rgba(255,255,255,.58); border-radius: 24px; color: white; background: rgba(11, 64, 123, .5); box-shadow: 0 12px 38px rgba(0,0,0,.24); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-align: center; font-size: clamp(1.2rem, 4vw, 1.7rem); font-weight: 650; line-height: 1.45; transform: translate(-50%, -50%); animation: aparecerGlass .55s ease both; }
    @keyframes aparecerGlass { from { transform: translate(-50%, -50%) scale(.82); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    .palabra-lluvia { position: fixed; top: -50px; z-index: -1; font-weight: bold; pointer-events: none; animation: caer 4s linear; }
    @keyframes caer { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(105vh); opacity: 0; } }
    .corazon { position: fixed; z-index: -1; bottom: -30px; width: 20px; height: 20px; background: var(--cor-color, #ff3b30); transform: rotate(45deg); animation: flotar 8s linear forwards; pointer-events: none; }
    .corazon::before, .corazon::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; background: inherit; }
    .corazon::before { top: -10px; } .corazon::after { left: -10px; }
    @keyframes flotar { to { transform: translateY(-110vh) rotate(45deg); opacity: 0; } }
    .globo { position: fixed; z-index: -1; bottom: -110px; width: clamp(38px, 8vw, 66px); height: clamp(50px, 10vw, 84px); border-radius: 50% 50% 47% 47%; background: radial-gradient(circle at 32% 27%, rgba(255,255,255,.78) 0 5%, transparent 7%), linear-gradient(135deg, #8bdaff, #0874d4); box-shadow: inset -9px -12px 18px rgba(0,55,135,.25), 0 7px 14px rgba(0,44,125,.16); pointer-events: none; animation: subirGlobo 13s linear forwards; }
    .globo::after { content: ""; position: absolute; left: 48%; top: 98%; width: 1px; height: 70px; background: rgba(206,241,255,.72); }
    @keyframes subirGlobo { to { transform: translateY(-125vh) translateX(var(--deriva)); opacity: 0; } }
    .confeti { position: fixed; z-index: -1; top: -18px; width: 9px; height: 16px; border-radius: 3px; pointer-events: none; animation: caerConfeti 7s linear forwards; }
    @keyframes caerConfeti { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    #flash { position: fixed; inset: 0; z-index: 20; pointer-events: none; opacity: 0; background: radial-gradient(circle, rgba(220,248,255,.95), rgba(94,186,255,.5) 35%, transparent 72%); }
    #flash.destello { animation: destello 1.1s ease-out both; }
    @keyframes destello { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
    body.final { background: #0d5a9b; }
    body.final::before { content: ""; position: fixed; inset: -35vmax; z-index: -2; background: radial-gradient(circle at 25% 30%, #8bd5e3 0 9%, transparent 25%), radial-gradient(circle at 78% 65%, #0869cb 0 11%, transparent 31%), radial-gradient(circle at 48% 48%, #2aa89e 0 14%, #11458d 45%, #102c67 70%); background-size: 65% 65%, 70% 70%, 100% 100%; animation: oleaje 22s ease-in-out infinite alternate; }
    @keyframes oleaje { to { transform: rotate(16deg) scale(1.14) translate(4%, -3%); filter: hue-rotate(15deg); } }
    #invitacion { width: min(650px, calc(100% - var(--margen) * 2)); align-self: center; justify-self: center; gap: 14px; padding: 32px 20px; text-align: center; text-shadow: 0 2px 14px rgba(0,0,0,.38); }
    #invitacion h1 { margin: 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; } #invitacion p { margin: 0 0 16px; font-size: clamp(1.1rem, 4vw, 1.5rem); }
    .opciones { position: relative; width: min(400px, 90vw); min-height: 170px; display: flex; justify-content: center; gap: 18px; align-items: flex-start; }
    #noBtn { background: rgba(12,39,91,.85); position: relative; transition: left .28s ease, top .28s ease; } #nota-no { min-height: 1.4em; font-size: .9rem; }
    .oculto { display: none !important; }
    @media (max-width: 600px) { #contenedor, #mensaje-amistad { padding: 18px; } .opciones { min-height: 210px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="bg-carousel" aria-hidden="true"></div>
  <audio id="musica" src="audiooficial.mp3" autoplay muted loop></audio>
  <div id="flash" aria-hidden="true"></div>
  <section id="inicio"><h1 id="titulo-inicio">PARA TI</h1><div class="texto-encima-boton">Dale click para abrir</div><button class="boton-circular" id="boton" type="button" aria-label="Abrir mensaje para Zoe">💌</button></section>
  <main id="contenedor" class="oculto"><h1 id="titulo">PARA TI</h1><img id="imagen" src="zoe1.jpg?v=3" alt="Un recuerdo bonito para Zoe"><div id="frase" aria-live="polite"></div><button id="siguienteBtn" type="button">Siguiente</button></main>
  <section id="mensaje-amistad" class="oculto" aria-live="polite">Solo trato de animarte porque eso es lo que los amigos hacen. Entenderé si quizá prefieres aún estar sola. 💙</section>
  <section id="invitacion" class="oculto"><h1>¿Miramos una película clásica de anime por meeet?</h1><p>Sé que te encantará ✨</p><div>Aplasta el botón:</div><div class="opciones"><button class="decision-btn" id="siBtn" type="button">Sí 💙</button><button class="decision-btn" id="noBtn" type="button">No</button></div><div id="nota-no" aria-live="polite"></div></section>
  <div id="contenedor-palabras" aria-hidden="true"></div><div id="contenedor-corazones" aria-hidden="true"></div><div id="contenedor-globos" aria-hidden="true"></div><div id="contenedor-confeti" aria-hidden="true"></div>
  <script>
    const frases = [
      'Helllooooouuuu',
      'Te habla el más sonso de los sonsos jasjkdjka: un zonziiitooo algo enfermito (por la gripe :u).',
      'Oyeee, al parecer tuviste un bajón muy fuerteee :c',
      'Me cuesta creerlo después de haberte visto muy alegre ayer.',
      'Se nota que eres una persona súper divertidaaa. No quisiera saber que estás triste; no importa qué tan fuerte sea la tormenta, porque siempre al final saldrá el sol. Así que animoos, Zoeeeee.',
      'Quieroo animarteeeeeeeeee.',
      'Me dijiste que te gusta el animeeeee, entonces ¿qué te parece si más tarde vemos una película clásicaaa de animeee por meet? Sé que te gustaráaa ;)'
    ];
    const imagenes = ['zoe1.jpg?v=3', 'zoe2.jpg?v=3', 'zoe3.jpg?v=3', 'zoe4.jpg?v=3', 'zoe5.jpg?v=3', 'zoe6.jpg?v=3', 'zoe7.jpg?v=1'];
    const palabras = ['hermosa', 'Zoe', 'Julia', 'Guadalupe', 'Lupe', 'bella', 'divina', 'linda', 'Sirenita', 'sonsita', 'blue', 'blucita', 'azulita', 'azuul'];
    let indice = 0, intentosNo = 0, efectosActivos = false;
    const $ = (id) => document.getElementById(id);
    function actualizarDiapositiva() { $('imagen').src = imagenes[indice % imagenes.length]; $('frase').textContent = frases[indice]; $('siguienteBtn').textContent = indice === frases.length - 1 ? 'Siguiente ✨' : 'Siguiente'; }
    function abrirChat(texto) { window.open(`https://wa.me/51948996922?text=${encodeURIComponent(texto)}`, '_blank', 'noopener'); }
    function mostrarFinal() { efectosActivos = false; $('contenedor-palabras').replaceChildren(); $('contenedor-corazones').replaceChildren(); $('contenedor-globos').replaceChildren(); $('contenedor-confeti').replaceChildren(); document.body.classList.add('final'); $('bg-carousel').classList.add('oculto'); $('invitacion').classList.remove('oculto'); $('mensaje-amistad').classList.remove('oculto'); setTimeout(() => $('mensaje-amistad').classList.add('oculto'), 5000); }
    function dispararTransicion() {
      $('flash').classList.remove('destello'); void $('flash').offsetWidth; $('flash').classList.add('destello');
      for (let i = 0; i < 9; i++) { const globo = document.createElement('div'); globo.className = 'globo'; globo.style.left = `${Math.random() * 96}vw`; globo.style.setProperty('--deriva', `${-90 + Math.random() * 180}px`); globo.style.animationDuration = `${3.4 + Math.random() * 2}s`; $('contenedor-globos').append(globo); setTimeout(() => globo.remove(), 6000); }
      for (let i = 0; i < 38; i++) { const confeti = document.createElement('div'); confeti.className = 'confeti'; confeti.style.left = `${Math.random() * 100}vw`; confeti.style.background = ['#8bd5e3', '#5baef5', '#2aa89e', '#d8f4ff'][Math.floor(Math.random() * 4)]; confeti.style.animationDuration = `${2.2 + Math.random() * 2}s`; confeti.style.animationDelay = `${Math.random() * .55}s`; $('contenedor-confeti').append(confeti); setTimeout(() => confeti.remove(), 5000); }
    }
    $('boton').addEventListener('click', () => { $('inicio').classList.add('oculto'); dispararTransicion(); const musica = $('musica'); musica.muted = false; musica.play().catch(() => {}); indice = 0; setTimeout(() => { $('contenedor').classList.remove('oculto'); efectosActivos = true; actualizarDiapositiva(); }, 850); });
    $('siguienteBtn').addEventListener('click', () => { if (indice < frases.length - 1) { indice++; actualizarDiapositiva(); return; } $('contenedor').classList.add('oculto'); mostrarFinal(); });
    $('siBtn').addEventListener('click', () => abrirChat('oyee sonsitoo,siii, hay que ver una pelicula ugu'));
    $('noBtn').addEventListener('click', () => { intentosNo++; if (intentosNo >= 5) { abrirChat('perdon, Anderson, en estos momentos deseo no hablar'); return; } const area = document.querySelector('.opciones'), boton = $('noBtn'); const maxX = Math.max(0, area.clientWidth - boton.offsetWidth), maxY = Math.max(35, area.clientHeight - boton.offsetHeight); boton.style.position = 'absolute'; boton.style.left = `${Math.random() * maxX}px`; boton.style.top = `${Math.random() * maxY}px`; $('nota-no').textContent = `Uy, ese botón se escapó (${intentosNo}/5) 😅`; });
    setInterval(() => { if (!efectosActivos) return; const palabra = document.createElement('div'); palabra.className = 'palabra-lluvia'; palabra.style.left = `${Math.random() * 90}%`; palabra.style.color = Math.random() > .5 ? '#ff3b30' : '#60bfff'; palabra.style.fontSize = `${18 + Math.random() * 18}px`; palabra.textContent = palabras[Math.floor(Math.random() * palabras.length)]; $('contenedor-palabras').append(palabra); setTimeout(() => palabra.remove(), 4500); }, 650);
    setInterval(() => { if (!efectosActivos) return; const corazon = document.createElement('div'); corazon.className = 'corazon'; corazon.style.setProperty('--cor-color', Math.random() > .5 ? '#ff3b30' : '#065bc8'); corazon.style.left = `${Math.random() * 100}vw`; corazon.style.animationDuration = `${5 + Math.random() * 5}s`; $('contenedor-corazones').append(corazon); setTimeout(() => corazon.remove(), 10000); }, 350);
    (() => { const bg = $('bg-carousel'), fondos = ['fondo-zoe-1.jpg?v=1', 'fondo-zoe-2.png?v=1']; let i = 0; const cambiar = () => { bg.style.backgroundImage = `url(${fondos[i]})`; i = (i + 1) % fondos.length; }; cambiar(); setInterval(cambiar, 5000); })();
  </script>
</body>
</html>
